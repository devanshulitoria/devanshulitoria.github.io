<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  {% include head.html %}
  <body>
    <script src="{{ '/assets/theme.js' | relative_url }}"></script>
    {% include header.html %}
    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        <div class="theme-toolbar">
          <button class="theme-switch" type="button" role="switch" aria-checked="false" hidden>
            <span>Dark mode</span>
            <span class="theme-switch__track" aria-hidden="true"></span>
          </button>
        </div>
        {{ content }}
      </div>
    </main>
    {% include footer.html %}
  </body>
</html>
